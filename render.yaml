# Render blueprint — API + Postgres + Redis. Deploy web to Vercel
# separately; set NEXT_PUBLIC_API_URL to this service's URL.
services:
  - type: web
    name: vaiip-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./apps/api
    region: oregon
    plan: starter
    healthCheckPath: /api/v1/health
    startCommand: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # Supabase pooler (session mode :5432 — migrations need it).
      # Set this in the dashboard; never commit the password.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://vianomics.com,https://app.vianomics.com
      - key: EXECUTION_ENABLED
        value: "false"          # stays off until IBKR verified
      - key: DEMO_FIXTURES
        value: "false"          # production = honest empty states
      - key: ADMIN_PASSWORD
        sync: false             # set in render dashboard
      - key: ADMIN_EMAIL
        value: admin@vianomics.com
      # provider keys — set in render dashboard (never in git):
      - key: TIINGO_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false

# Postgres lives on Supabase — set DATABASE_URL in the dashboard:
# postgresql+asyncpg://postgres.<ref>:<pw>@aws-0-us-east-1.pooler.supabase.com:5432/postgres
