# Render blueprint — API + Postgres + Redis. Deploy web to Vercel
# separately; set NEXT_PUBLIC_API_URL to this service's URL.
services:
  - type: web
    name: vaiip-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /healthz
    startCommand: >
      sh -c "alembic upgrade head &&
             python -m app.seeds.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # Supabase pooler (session mode :5432 — migrations need it).
      # Set this in the dashboard; never commit the password.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://vesturs.com,https://app.vesturs.com
      - key: EXECUTION_ENABLED
        value: "false"          # stays off until IBKR verified
      - key: DEMO_FIXTURES
        value: "false"          # production = honest empty states
      - key: ADMIN_PASSWORD
        sync: false             # set in render dashboard
      - key: ADMIN_EMAIL
        value: admin@vesturs.com
      # provider keys — set in render dashboard (never in git):
      - key: TIINGO_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # IBKR — VPS bridge (apps/bridge); gateway never runs here
      - key: IBKR_BRIDGE_URL
        sync: false
      - key: IBKR_BRIDGE_SECRET
        sync: false
      # scheduler auth — POST /api/v1/internal/jobs/* requires this
      - key: CRON_SECRET
        sync: false

# ── Phase-4/6 cadence (doc): the pyramid maintenance loop runs after
# every US cash close; the Three Reviews run weekly/monthly/quarterly.
# Each cronjob POSTs the job key to the API's secret-gated internal
# endpoint — the job itself is the same code the UI's "run now" calls.
  - type: cronjob
    name: vaiip-ingest-daily
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    # 22:00 UTC Mon–Fri — bars land after both DST-season closes and
    # BEFORE pyramid:maintain at 22:30 (fresh data → then maintain)
    schedule: "0 22 * * 1-5"
    startCommand: python -m app.cron_trigger ingest:daily
    envVars:
      - key: API_URL
        value: https://vianomics.onrender.com
      - key: CRON_JOB
        value: ingest:daily      # manual dashboard creation has no
      - key: CRON_SECRET         # command field — the image's env-
        sync: false              # driven CMD reads this instead

  - type: cronjob
    name: vaiip-pyramid-maintain
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    # 22:30 UTC Mon–Fri — after both EDT (20:00) and EST (21:00) closes
    schedule: "30 22 * * 1-5"
    startCommand: python -m app.cron_trigger pyramid:maintain
    envVars:
      - key: API_URL
        value: https://vianomics.onrender.com
      - key: CRON_JOB
        value: pyramid:maintain
      - key: CRON_SECRET
        sync: false

  - type: cronjob
    name: vaiip-review-weekly
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    schedule: "0 8 * * 0"            # Sunday — weekly Four-M's review
    startCommand: python -m app.cron_trigger review:weekly
    envVars:
      - key: API_URL
        value: https://vianomics.onrender.com
      - key: CRON_JOB
        value: review:weekly
      - key: CRON_SECRET
        sync: false

  - type: cronjob
    name: vaiip-review-monthly
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    schedule: "0 9 1 * *"            # 1st — monthly MOS re-rank
    startCommand: python -m app.cron_trigger review:monthly
    envVars:
      - key: API_URL
        value: https://vianomics.onrender.com
      - key: CRON_JOB
        value: review:monthly
      - key: CRON_SECRET
        sync: false

  - type: cronjob
    name: vaiip-review-quarterly
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    schedule: "0 10 1 1,4,7,10 *"    # quarter starts — margin review
    startCommand: python -m app.cron_trigger review:quarterly
    envVars:
      - key: API_URL
        value: https://vianomics.onrender.com
      - key: CRON_JOB
        value: review:quarterly
      - key: CRON_SECRET
        sync: false

  - type: cronjob
    name: vaiip-universe-alpaca
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    schedule: "0 6 * * 0"            # Sunday — refresh discovery pool
    startCommand: python -m app.cron_trigger universe:alpaca:sync
    envVars:
      - key: API_URL
        value: https://vianomics.onrender.com
      - key: CRON_JOB
        value: universe:alpaca:sync
      - key: CRON_SECRET
        sync: false

  - type: cronjob
    name: vaiip-ibkr-sync
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    schedule: "*/30 13-21 * * 1-5"   # market hours — keep the IBKR
    startCommand: python -m app.cron_trigger portfolio:ibkr:sync
    envVars:                          # panel fresh via the bridge
      - key: API_URL
        value: https://vianomics.onrender.com
      - key: CRON_JOB
        value: portfolio:ibkr:sync
      - key: CRON_SECRET
        sync: false

# Postgres lives on Supabase — set DATABASE_URL in the dashboard:
# postgresql+asyncpg://postgres.<ref>:<pw>@aws-0-us-east-1.pooler.supabase.com:5432/postgres
